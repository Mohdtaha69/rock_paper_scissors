<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        button{
            padding:10px 20px;
            margin:10px;
            font-size:18px;
            cursor:pointer;
        }

        #result{
            margin-top:30px;
            font-size:22px;
        }

        #score{
            margin-top:15px;
            font-size:20px;
        }

        #winner{
            margin-top:25px;
            font-size:28px;
            font-weight:bold;
        }
    </style>
</head>
<body>

<h1>Rock Paper Scissors</h1>

<button id="rock">Rock</button>
<button id="paper">Paper</button>
<button id="scissors">Scissors</button>

<div id="result"></div>
<div id="score"></div>
<div id="winner"></div>

<script src="script.js"></script>

</body>
</html>
